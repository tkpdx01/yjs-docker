name: Build Y-WebSocket Docker Image (Public)

on:
  workflow_dispatch:

jobs:
  build:
    runs-on: ubuntu-22.04

    steps:
      - uses: actions/checkout@v4

      - name: Log in to Docker Hub (optional, safe even if no secrets)
        uses: docker/login-action@v3
        with:
          username: ${{ secrets.DOCKERHUB_USERNAME || '' }}
          password: ${{ secrets.DOCKERHUB_TOKEN || '' }}

      - name: Pull public image
        run: |
          mkdir -p output
          docker pull tobias47n9e/y-websocket:latest
          docker tag tobias47n9e/y-websocket:latest yjs-websocket:latest

      - name: Export Docker image to tar
        run: |
          docker save yjs-websocket:latest -o output/yjs-websocket.tar

      - name: Upload artifact
        uses: actions/upload-artifact@v4
        with:
          name: yjs-websocket
          path: output/yjs-websocket.tar
