name: Build Y-WebSocket Docker Image (Mirror Config)

on:
  workflow_dispatch:

jobs:
  build:
    runs-on: ubuntu-22.04

    steps:
      - uses: actions/checkout@v4

      # 1️⃣ 配置 registry mirror
      - name: Configure Docker registry mirror
        run: |
          echo '{ "registry-mirrors": ["https://d.xax920.eu.org"] }' | sudo tee /etc/docker/daemon.json
          sudo systemctl restart docker
          docker info | grep -A 3 "Registry Mirrors"

      # 2️⃣ 拉取公开镜像（来自 Docker Hub）
      - name: Pull and export Y-WebSocket
        run: |
          mkdir -p output
          docker pull tobias47n9e/y-websocket:latest
          docker tag tobias47n9e/y-websocket:latest yjs-websocket:latest
          docker save yjs-websocket:latest -o output/yjs-websocket.tar

      # 3️⃣ 上传结果
      - name: Upload artifact
        uses: actions/upload-artifact@v4
        with:
          name: yjs-websocket
          path: output/yjs-websocket.tar
