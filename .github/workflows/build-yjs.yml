name: Build Y-WebSocket Docker Image

on:
  workflow_dispatch:

jobs:
  build:
    runs-on: ubuntu-22.04

    steps:
      - uses: actions/checkout@v4

      - name: Checkout y-websocket source
        uses: actions/checkout@v4
        with:
          repository: y-crdt/y-websocket
          token: ${{ secrets.GH_PAT }}   # ✅ 使用个人 PAT
          path: y-websocket

      - name: Set up Node.js
        uses: actions/setup-node@v4
        with:
          node-version: 20

      - name: Set up pnpm
        uses: pnpm/action-setup@v3
        with:
          version: 9

      - name: Install dependencies
        run: |
          cd y-websocket
          pnpm install

      - name: Build Docker image
        run: |
          cd y-websocket
          docker build -t yjs-websocket:latest .

      - name: Export Docker image
        run: |
          mkdir -p output
          docker save yjs-websocket:latest -o output/yjs-websocket.tar

      - name: Upload artifact
        uses: actions/upload-artifact@v4
        with:
          name: yjs-websocket
          path: output/yjs-websocket.tar
