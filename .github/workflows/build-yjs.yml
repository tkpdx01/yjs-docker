name: Build Y-WebSocket Docker Image (Proxy)

on:
  workflow_dispatch:

jobs:
  build:
    runs-on: ubuntu-22.04

    steps:
      - uses: actions/checkout@v4

      # 可选：显示 docker 信息
      - name: Check Docker Info
        run: docker info

      # 拉取镜像时使用 d.xax920.eu.org 代理
      - name: Pull image via proxy
        run: |
          mkdir -p output
          # ✅ 使用代理拉取
          docker pull ipirozhenko/y-websocket:latest
          # ✅ 打上正常标签
          docker tag ipirozhenko/y-websocket yjs-websocket:latest

      - name: Export Docker image
        run: |
          docker save yjs-websocket:latest -o output/yjs-websocket.tar

      - name: Upload artifact
        uses: actions/upload-artifact@v4
        with:
          name: yjs-websocket
          path: output/yjs-websocket.tar
