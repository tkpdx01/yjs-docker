name: Build YJS Docker Image

on:
  workflow_dispatch:

jobs:
  build:
    runs-on: ubuntu-22.04
    environment: DOCKERHUB_USERNAME

    steps:
      - uses: actions/checkout@v4

      - name: Log in to Docker Hub
        uses: docker/login-action@v3
        with:
          username: ${{ secrets.DOCKERHUB_USERNAME }}
          password: ${{ secrets.DOCKERHUB_TOKEN }}

      - name: Set up Docker Buildx
        uses: docker/setup-buildx-action@v3

      - name: Pull and export image
        run: |
          mkdir -p output
          docker pull ghcr.io/y-crdt/wy-websocket:latest
          docker tag ghcr.io/y-crdt/wy-websocket:latest yjs:latest
          docker save yjs:latest -o output/yjs-image.tar

      - name: Upload image artifact
        uses: actions/upload-artifact@v4
        with:
          name: yjs-image
          path: output/yjs-image.tar
